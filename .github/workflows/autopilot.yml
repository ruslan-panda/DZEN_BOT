name: AlgoMoney Autopilot

on:
  schedule:
    # Запуск каждые 4 часа за 30 минут до ровного часа (UTC)
    - cron: '30 3,7,11,15,19,23 * * *'
  workflow_dispatch: # Кнопка ручного запуска для тестов

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Случайная задержка (±30 мин)
        if: github.event_name == 'schedule'
        run: |
          # Для ПРИВАТНОГО репо замените 3600 на 420 (до 7 мин), чтобы не сжечь лимит 2000 мин/мес
          python -c "import random, time; d = random.randint(0, 3600); print(f'Пауза {d} сек...'); time.sleep(d)"

      - name: Запуск публикации
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          DZEN_CHANNEL_URL: ${{ secrets.DZEN_CHANNEL_URL }}
          TG_TECH_CHANNEL: ${{ secrets.TG_TECH_CHANNEL }}
          TG_PUBLIC_CHANNEL: ${{ secrets.TG_PUBLIC_CHANNEL }}
          ENABLE_TELEGRAM: "True"
          SERVER_HEADLESS: "True"
          SAVE_LOCAL_DOCX: "False"
          PROXY_URL: ""
        run: python dzen_autopilot.py --mode full

      - name: Сохранение истории used_topics.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f used_topics.txt
          git diff --cached --quiet || (git commit -m "Update used_topics" && git push)